<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
  <defs>
    <pattern id="flap_crosshatch" width="2.2" height="2.2" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="2.2" height="2.2" fill="#E6E6E6"/>
      <line x1="0" y1="0" x2="0" y2="2.2" stroke="#B8B8B8" stroke-width="0.32"/>
      <line x1="0" y1="0" x2="2.2" y2="0" stroke="#B8B8B8" stroke-width="0.32"/>
    </pattern>
  </defs>
  <!-- OPTICAL REGISTRATION MARKS -->
  <g id="REGISTRATION_MARKS" fill="#000000">
    <rect x="15.0" y="3.0" width="5" height="5"/>
    <rect x="195.9" y="3.0" width="5" height="5"/>
  </g>
  <!-- HEADER & LEGEND SWATCHES -->
  <text x="24" y="6.8" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="3.2" fill="#111111">3D Papercraft Template (Pepakura Alternative) — Page 3/6</text>
  <g id="LEGEND" transform="translate(24, 11.2)" font-family="Helvetica, Arial, sans-serif" font-size="2.0" fill="#333333">
    <line x1="0" y1="0" x2="8" y2="0" stroke="#000000" stroke-width="0.4"/>
    <text x="10" y="0.7">Solid: Cut Line</text>
    <line x1="32" y1="0" x2="40" y2="0" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <text x="42" y="0.7">Dashed Red: Mountain Fold (_ _ _)</text>
    <line x1="88" y1="0" x2="96" y2="0" stroke="#1976D2" stroke-width="0.4" stroke-dasharray="2.0,0.7,0.5,0.7"/>
    <text x="98" y="0.7">Dash-Dot Blue: Valley Fold (_ . _ .)</text>
    <rect x="142" y="-1.8" width="6" height="3.5" fill="url(#flap_crosshatch)" stroke="#777777" stroke-width="0.25"/>
    <text x="150" y="0.7">Flap (Cross-lined)</text>
  </g>
  <!-- PART FACETS -->
  <g id="FACETS" fill="#FBF9F5" stroke="none">
    <polygon points="15.00,20.50 192.76,20.50 192.76,141.70 15.00,141.70"/>
    <polygon points="154.38,244.87 15.00,244.87 15.00,157.70 154.38,157.70"/>
  </g>
  <!-- GLUE TABS (OUTWARD 45° WITH CROSS-HATCH PATTERN) -->
  <g id="GLUE_TABS" fill="url(#flap_crosshatch)" stroke="none">
    <polygon points="15.00,20.50 20.50,15.00 187.26,15.00 192.76,20.50"/>
    <polygon points="192.76,141.70 187.26,147.20 20.50,147.20 15.00,141.70"/>
    <polygon points="15.00,157.70 20.50,152.20 148.88,152.20 154.38,157.70"/>
    <polygon points="154.38,157.70 159.88,163.20 159.88,239.37 154.38,244.87"/>
    <polygon points="154.38,244.87 148.88,250.37 20.50,250.37 15.00,244.87"/>
  </g>
  <!-- INTERNAL CREASE LINES -->
  <g id="FOLD_LINES">
    <line x1="15.00" y1="20.50" x2="192.76" y2="20.50" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="192.76" y1="141.70" x2="15.00" y2="141.70" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="15.00" y1="157.70" x2="154.38" y2="157.70" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="154.38" y1="157.70" x2="154.38" y2="244.87" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="154.38" y1="244.87" x2="15.00" y2="244.87" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
  </g>
  <!-- CUT OUTLINES -->
  <g id="CUT_LINES" fill="none" stroke="#000000" stroke-width="0.4">
    <polygon points="15.00,20.50 20.50,15.00 187.26,15.00 192.76,20.50 192.76,141.70 187.26,147.20 20.50,147.20 15.00,141.70"/>
    <polygon points="154.38,244.87 148.88,250.37 20.50,250.37 15.00,244.87 15.00,157.70 20.50,152.20 148.88,152.20 154.38,157.70 159.88,163.20 159.88,239.37"/>
  </g>
  <!-- EDGE ID NUMBERS (PROTECTED BADGE ON TABS, EXTERIOR IN SCRAP MARGIN) -->
  <g id="EDGE_IDS" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <circle cx="103.88" cy="17.75" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="103.88" y="17.75" fill="#111111">1</text>
    <circle cx="103.88" cy="144.45" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="103.88" y="144.45" fill="#111111">3</text>
    <text x="194.76" y="81.10" fill="#222222">2</text>
    <text x="13.00" y="81.10" fill="#222222">4</text>
    <circle cx="84.69" cy="154.95" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="84.69" y="154.95" fill="#111111">9</text>
    <circle cx="157.13" cy="201.28" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="157.13" y="201.28" fill="#111111">16</text>
    <circle cx="84.69" cy="247.62" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="84.69" y="247.62" fill="#111111">20</text>
    <text x="13.00" y="201.28" fill="#222222">15</text>
  </g>
  <!-- FOOTER BRANDING -->
  <text x="107.95" y="274.40" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="4.94" text-anchor="middle" fill="#111111">The Fine Exchange</text>
</svg>