<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="215.9mm" height="279.4mm" viewBox="0 0 215.9 279.4">
  <defs>
    <pattern id="flap_crosshatch" width="2.2" height="2.2" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="2.2" height="2.2" fill="#E6E6E6"/>
      <line x1="0" y1="0" x2="0" y2="2.2" stroke="#B8B8B8" stroke-width="0.32"/>
      <line x1="0" y1="0" x2="2.2" y2="0" stroke="#B8B8B8" stroke-width="0.32"/>
    </pattern>
  </defs>
  <!-- OPTICAL REGISTRATION MARKS -->
  <g id="REGISTRATION_MARKS" fill="#000000">
    <rect x="15.0" y="3.0" width="5" height="5"/>
    <rect x="195.9" y="3.0" width="5" height="5"/>
  </g>
  <!-- HEADER & LEGEND SWATCHES -->
  <text x="24" y="6.8" font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="3.2" fill="#111111">3D Papercraft Template (Pepakura Alternative) — Page 5/6</text>
  <g id="LEGEND" transform="translate(24, 11.2)" font-family="Helvetica, Arial, sans-serif" font-size="2.0" fill="#333333">
    <line x1="0" y1="0" x2="8" y2="0" stroke="#000000" stroke-width="0.4"/>
    <text x="10" y="0.7">Solid: Cut Line</text>
    <line x1="32" y1="0" x2="40" y2="0" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <text x="42" y="0.7">Dashed Red: Mountain Fold (_ _ _)</text>
    <line x1="88" y1="0" x2="96" y2="0" stroke="#1976D2" stroke-width="0.4" stroke-dasharray="2.0,0.7,0.5,0.7"/>
    <text x="98" y="0.7">Dash-Dot Blue: Valley Fold (_ . _ .)</text>
    <rect x="142" y="-1.8" width="6" height="3.5" fill="url(#flap_crosshatch)" stroke="#777777" stroke-width="0.25"/>
    <text x="150" y="0.7">Flap (Cross-lined)</text>
  </g>
  <!-- PART FACETS -->
  <g id="FACETS" fill="#FBF9F5" stroke="none">
    <polygon points="20.50,20.50 125.85,20.50 125.85,132.82 20.50,132.82"/>
    <polygon points="127.32,148.82 127.32,254.17 15.00,254.17 15.00,148.82"/>
  </g>
  <!-- GLUE TABS (OUTWARD 45° WITH CROSS-HATCH PATTERN) -->
  <g id="GLUE_TABS" fill="url(#flap_crosshatch)" stroke="none">
    <polygon points="125.85,132.82 120.35,138.32 26.00,138.32 20.50,132.82"/>
    <polygon points="20.50,132.82 15.00,127.32 15.00,26.00 20.50,20.50"/>
    <polygon points="20.50,20.50 26.00,15.00 120.35,15.00 125.85,20.50"/>
    <polygon points="15.00,148.82 20.50,143.32 121.82,143.32 127.32,148.82"/>
  </g>
  <!-- INTERNAL CREASE LINES -->
  <g id="FOLD_LINES">
    <line x1="125.85" y1="132.82" x2="20.50" y2="132.82" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="20.50" y1="132.82" x2="20.50" y2="20.50" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="20.50" y1="20.50" x2="125.85" y2="20.50" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
    <line x1="15.00" y1="148.82" x2="127.32" y2="148.82" stroke="#D32F2F" stroke-width="0.4" stroke-dasharray="1.5,0.7"/>
  </g>
  <!-- CUT OUTLINES -->
  <g id="CUT_LINES" fill="none" stroke="#000000" stroke-width="0.4">
    <polygon points="20.50,20.50 26.00,15.00 120.35,15.00 125.85,20.50 125.85,132.82 120.35,138.32 26.00,138.32 20.50,132.82 15.00,127.32 15.00,26.00"/>
    <polygon points="127.32,148.82 127.32,254.17 15.00,254.17 15.00,148.82 20.50,143.32 121.82,143.32"/>
  </g>
  <!-- EDGE ID NUMBERS (PROTECTED BADGE ON TABS, EXTERIOR IN SCRAP MARGIN) -->
  <g id="EDGE_IDS" font-family="Helvetica, Arial, sans-serif" font-size="2.2" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <circle cx="73.17" cy="135.57" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="73.17" y="135.57" fill="#111111">9</text>
    <circle cx="17.75" cy="76.66" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="17.75" y="76.66" fill="#111111">12</text>
    <circle cx="73.17" cy="17.75" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="73.17" y="17.75" fill="#111111">14</text>
    <text x="127.85" y="76.66" fill="#222222">11</text>
    <circle cx="71.16" cy="146.07" r="2.2" fill="#E6E6E6" stroke="#999999" stroke-width="0.2"/>
    <text x="71.16" y="146.07" fill="#111111">10</text>
    <text x="13.00" y="201.50" fill="#222222">9</text>
    <text x="71.16" y="256.17" fill="#222222">13</text>
    <text x="129.32" y="201.50" fill="#222222">15</text>
  </g>
</svg>